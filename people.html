      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;

    })();
  </script>
  <style id="gv-critical-bg">
    html,
    body {
      margin: 0;
      background: #eef9ff;
    }

    html[data-theme="dark"],
    html[data-theme="dark"] body {
      background: #07131f;
    }
  </style>
